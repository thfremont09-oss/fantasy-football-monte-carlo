[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

# Shared by both themes. The site follows the phone/computer's light or dark setting,
# and the Light / Dark button in the header overrides it.
[theme]
showWidgetBorder = true
baseRadius = "small"
baseFontSize = 15
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "Barlow Condensed:https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
headingFontWeights = [700, 700, 600]
headingFontSizes = ["2.4rem", "1.75rem", "1.3rem"]

[theme.light]
primaryColor = "#16324f"
backgroundColor = "#f5f6f8"
secondaryBackgroundColor = "#eceff3"
textColor = "#14202e"
linkColor = "#1d5fa8"
borderColor = "#dfe3e8"
codeBackgroundColor = "#f0f2f5"
dataframeHeaderBackgroundColor = "#eceff3"

[theme.light.sidebar]
backgroundColor = "#eceff3"

[theme.dark]
primaryColor = "#5b9cf0"
backgroundColor = "#0d141d"
secondaryBackgroundColor = "#18222f"
textColor = "#e3e9f0"
linkColor = "#7fb2f5"
borderColor = "#2a3644"
codeBackgroundColor = "#141d28"
dataframeHeaderBackgroundColor = "#18222f"

[theme.dark.sidebar]
backgroundColor = "#141d28"
