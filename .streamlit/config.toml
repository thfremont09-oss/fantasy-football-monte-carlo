[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1d5c4a"
backgroundColor = "#fbfaf7"
secondaryBackgroundColor = "#f2f0ea"
textColor = "#1c1f23"
linkColor = "#1d5c4a"
borderColor = "#e2dfd6"
codeBackgroundColor = "#f4f2ec"
dataframeHeaderBackgroundColor = "#f2f0ea"
showWidgetBorder = true
baseRadius = "small"
baseFontSize = 15
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [600, 600, 600]
headingFontSizes = ["2.4rem", "1.6rem", "1.2rem"]

[theme.sidebar]
backgroundColor = "#f2f0ea"
