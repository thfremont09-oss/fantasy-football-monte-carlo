<html><head><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet"><style>
body{margin:0;width:1200px;height:630px;background:#0c1a2b;font-family:Archivo,sans-serif;color:#fff;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.7px) 0 0/26px 26px}
.glow{position:absolute;right:-160px;top:-160px;width:620px;height:620px;border-radius:50%;background:radial-gradient(rgba(232,51,58,.28),transparent 65%)}
.wrap{position:absolute;left:84px;top:92px;right:84px}
.row{display:flex;align-items:center;gap:28px}
img{width:132px;height:132px;border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.name{font-weight:900;font-size:86px;letter-spacing:-.025em;line-height:.95}
.name b{color:#f2b134;font-weight:900}
.sub{font-weight:700;font-size:25px;letter-spacing:.32em;color:#9fb0c4;margin-top:12px}
h1{font-weight:800;font-size:64px;line-height:1.06;letter-spacing:-.02em;margin:64px 0 0}.chips{display:flex;gap:12px;margin-top:30px}.chips span{border:1.5px solid rgba(255,255,255,.22);border-radius:999px;padding:8px 18px;font-weight:700;font-size:22px;color:#dfe6ee}
h1 em{font-style:normal;color:#ff5a60}
.foot{position:absolute;left:84px;bottom:56px;font-weight:600;font-size:26px;color:#c9d3df}
.bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(90deg,#e8333a,#f2b134)}
</style></head><body><div class="grid"></div><div class="glow"></div><div class="wrap">
<div class="row"><img src="{uri}"><div><div class="name">Monte<b>.</b></div><div class="sub">SPORTS LAB</div></div></div>
<h1>Best bets, live odds &amp; <em>fantasy lineups</em></h1><div class="chips"><span>NFL</span><span>NBA</span><span>NHL</span><span>Premier League</span><span>FPL</span><span>F1 Fantasy</span><span>Kalshi</span></div></div>
<div class="foot">Every game simulated 1,000,000 times &nbsp;·&nbsp; montesportslab.com</div><div class="bar"></div></body></html>
